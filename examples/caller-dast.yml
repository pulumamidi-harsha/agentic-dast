# App caller — CI only. Drop as .github/workflows/agentic-dast.yml
name: Agentic DAST

on:
  schedule:
    - cron: "0 2 * * *"   # nightly baseline
  workflow_dispatch:
    inputs:
      target_url:
        description: Override target (defaults to vars.DAST_TARGET_URL)
        required: false
        type: string
      scan_profile:
        description: baseline = fast; deep = stricter full scan
        required: false
        type: choice
        options: [baseline, deep, api]
        default: baseline

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  dast:
    if: ${{ vars.DAST_TARGET_URL != '' || inputs.target_url != '' }}
    uses: pulumamidi-harsha/agentic-dast/.github/workflows/dast.yml@main
    with:
      pipeline_repository: pulumamidi-harsha/agentic-dast
      pipeline_ref: main
      target_url: ${{ inputs.target_url || vars.DAST_TARGET_URL }}
      scan_profile: ${{ inputs.scan_profile || 'baseline' }}
    secrets:
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_API_ENDPOINT: ${{ secrets.AI_API_ENDPOINT }}
      ORG_PAT: ${{ secrets.ORG_PAT }}
      DAST_AUTH_HEADER_VALUE: ${{ secrets.DAST_AUTH_HEADER_VALUE }}
