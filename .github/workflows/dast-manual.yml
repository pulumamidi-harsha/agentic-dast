# Hub-local runner — GitHub Actions only (do not run scanners on corp laptops).
name: DAST manual (hub)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Non-prod URL to scan (never production)
        required: true
        type: string
      scan_profile:
        description: baseline = fast passive; deep = ZAP full + richer Nuclei
        required: false
        type: choice
        options: [baseline, deep, api]
        default: baseline
  schedule:
    # Nightly baseline when DAST_TARGET_URL repo variable is set
    - cron: "0 3 * * *"

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  dast:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.DAST_TARGET_URL != '' }}
    uses: ./.github/workflows/dast.yml
    with:
      pipeline_repository: ${{ github.repository }}
      pipeline_ref: ${{ github.sha }}
      target_url: ${{ github.event.inputs.target_url || vars.DAST_TARGET_URL }}
      # Scheduled runs stay on baseline; manual can pick deep
      scan_profile: ${{ github.event.inputs.scan_profile || 'baseline' }}
    secrets:
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_API_ENDPOINT: ${{ secrets.AI_API_ENDPOINT }}
      ORG_PAT: ${{ secrets.ORG_PAT }}
      DAST_AUTH_HEADER_VALUE: ${{ secrets.DAST_AUTH_HEADER_VALUE }}
