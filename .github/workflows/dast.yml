# Job — ZAP baseline + Nuclei + AI triage (scheduled / manual callers).
# Not intended for pull_request gates.
name: Agentic DAST

on:
  workflow_call:
    inputs:
      pipeline_repository:
        description: Hub repo (org/repo)
        required: false
        type: string
        default: pulumamidi-harsha/agentic-dast
      pipeline_ref:
        description: Git ref / SHA for hub scripts
        required: false
        type: string
        default: main
      target_url:
        description: Live non-prod URL to scan (https://…)
        required: true
        type: string
      scan_profile:
        description: baseline (Phase A) or api (Phase B reserved)
        required: false
        type: string
        default: baseline
      ai_model:
        required: false
        type: string
        default: gpt-4.1
      issue_title:
        required: false
        type: string
        default: Agentic DAST — latest scan results
    secrets:
      AI_API_KEY:
        required: false
      AI_API_ENDPOINT:
        required: false
      ORG_PAT:
        required: false
      DAST_AUTH_HEADER_VALUE:
        description: Optional Bearer/cookie value for authenticated scans
        required: false

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: agentic-dast-${{ github.repository }}
  cancel-in-progress: false

env:
  AGENTIC_TMP: /tmp/agentic-dast
  PIPELINE_DIR: /tmp/agentic-dast-pipeline
  AI_MODEL: ${{ inputs.ai_model }}

jobs:
  dast:
    name: ZAP + Nuclei + AI triage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      dast_status: ${{ steps.scans.outputs.dast_status }}
      findings_total: ${{ steps.scans.outputs.findings_total }}
      triage_status: ${{ steps.triage.outputs.triage_status }}
    steps:
      - name: Clone DAST hub
        env:
          PIPELINE_TOKEN: ${{ secrets.ORG_PAT || github.token }}
          PIPELINE_REPO: ${{ inputs.pipeline_repository }}
          PIPELINE_REF: ${{ inputs.pipeline_ref }}
        run: |
          rm -rf "$PIPELINE_DIR"
          git clone "https://x-access-token:${PIPELINE_TOKEN}@github.com/${PIPELINE_REPO}.git" "$PIPELINE_DIR"
          git -C "$PIPELINE_DIR" checkout "$PIPELINE_REF"
          chmod +x "$PIPELINE_DIR"/scripts/*.sh

      - name: Run ZAP baseline + Nuclei
        id: scans
        env:
          TARGET_URL: ${{ inputs.target_url }}
          SCAN_PROFILE: ${{ inputs.scan_profile }}
          PIPELINE_DIR: ${{ env.PIPELINE_DIR }}
          DAST_AUTH_HEADER_VALUE: ${{ secrets.DAST_AUTH_HEADER_VALUE }}
        run: bash "$PIPELINE_DIR/scripts/run-scans.sh"

      - name: AI triage
        id: triage
        continue-on-error: true
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_ENDPOINT: ${{ secrets.AI_API_ENDPOINT }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: bash "$PIPELINE_DIR/scripts/ai-triage.sh"

      - name: Upload DAST artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentic-dast
          path: |
            ${{ env.AGENTIC_TMP }}/dast-findings.json
            ${{ env.AGENTIC_TMP }}/dast-result.json
            ${{ env.AGENTIC_TMP }}/dast-triage.json
            ${{ env.AGENTIC_TMP }}/dast-report.md
            ${{ env.AGENTIC_TMP }}/zap-findings.json
            ${{ env.AGENTIC_TMP }}/nuclei-findings.json
            ${{ env.AGENTIC_TMP }}/raw/
            ${{ env.AGENTIC_TMP }}/reports/
          retention-days: 14
          if-no-files-found: warn

      - name: Post / update sticky Issue
        if: always()
        uses: actions/github-script@v7
        env:
          AGENTIC_TMP: ${{ env.AGENTIC_TMP }}
          DAST_ISSUE_TITLE: ${{ inputs.issue_title }}
          PIPELINE_DIR: ${{ env.PIPELINE_DIR }}
        with:
          script: |
            const path = require('path');
            const mod = path.join(process.env.PIPELINE_DIR, 'scripts', 'post-dast-issue.js');
            const post = require(mod);
            await post({ github, context, core });

      - name: Step summary
        if: always()
        run: |
          echo "## Agentic DAST" >> "$GITHUB_STEP_SUMMARY"
          echo "Target: \`${{ inputs.target_url }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Profile: ${{ inputs.scan_profile }}" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "${AGENTIC_TMP}/dast-result.json" ]]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "${AGENTIC_TMP}/dast-result.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f "${AGENTIC_TMP}/dast-report.md" ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            head -n 80 "${AGENTIC_TMP}/dast-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
